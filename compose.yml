services:
  gemini-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gemini-mcp-server
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8088}:8000"
    env_file:
      - .env
    extra_hosts:
      # Allows MCP container to communicate with local LLMs running on the host (Windows / macOS / Linux)
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).getcode() == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-mcp
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://gemini-mcp:8000
    depends_on:
      gemini-mcp:
        condition: service_healthy
